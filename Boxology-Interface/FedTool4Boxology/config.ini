[default]
main_directory: .

[datasets]
number_of_datasets: 3
output_folder: ${default:main_directory}/rdfizer_output
all_in_one_file: yes
remove_duplicate: yes
name: FedTool4Boxology
enrichment: no
ordered: yes
large_file: false

[dataset1]
name: Papers
mapping: ${default:main_directory}/mappings/mapping_papers.ttl

[dataset2]
name: Datasets
mapping: ${default:main_directory}/mappings/mapping_datasets.ttl

[dataset3]
name: Boxologies
mapping: ${default:main_directory}/mappings/mapping_boxologies.ttl
