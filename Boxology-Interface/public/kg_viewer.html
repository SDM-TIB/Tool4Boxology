const ONTOLOGY_URL_CANDIDATES = [
  window.__CONFIG__?.ONTOLOGY_URL,
  '/Tool4BoxologyOntology.ttl',

  '../Tool4BoxologyOntology.ttl',
  '../../Tool4BoxologyOntology.ttl'
].filter(Boolean);

const ontologyState = {
  loaded: false,
  sourceUrl: null,
  classInfoByName: new Map(),
  parentsByName: new Map(),
  aliases: new Map(),
};

function localNameFromUri(uri) {
  if (!uri) return '';
  const parts = uri.split(/[#/]/);
  return parts[parts.length - 1] || uri;
}

function ensureOntologyClass(name) {
  if (!name) return;
  if (!ontologyState.classInfoByName.has(name)) {
    ontologyState.classInfoByName.set(name, { label: name, comment: '' });
  }
  if (!ontologyState.parentsByName.has(name)) {
    ontologyState.parentsByName.set(name, new Set());
  }
}

function parseOntologyTurtle(ttlText) {
  const classMatches = ttlText.matchAll(/<([^>]+)>\s+rdf:type\s+owl:Class\b/g);
  for (const m of classMatches) {
    const c = localNameFromUri(m[1]);
    ensureOntologyClass(c);
  }

  const subMatches = ttlText.matchAll(/<([^>]+)>\s+rdfs:subClassOf\s+([\s\S]*?)\s*\./g);
  for (const m of subMatches) {
    const child = localNameFromUri(m[1]);
    ensureOntologyClass(child);
    const parentUris = [...m[2].matchAll(/<([^>]+)>/g)].map(x => localNameFromUri(x[1]));
    parentUris.forEach(parent => {
      ensureOntologyClass(parent);
      ontologyState.parentsByName.get(child).add(parent);
    });
  }

  const labelMatches = ttlText.matchAll(/<([^>]+)>\s+rdfs:label\s+"([^"]+)"/g);
  for (const m of labelMatches) {
    const c = localNameFromUri(m[1]);
    ensureOntologyClass(c);
    ontologyState.classInfoByName.get(c).label = m[2];
  }

  const commentMatches = ttlText.matchAll(/<([^>]+)>\s+rdfs:comment\s+"([\s\S]*?)"\s*[;\.]/g);
  for (const m of commentMatches) {
    const c = localNameFromUri(m[1]);
    ensureOntologyClass(c);
    ontologyState.classInfoByName.get(c).comment = m[2].trim();
  }

  ontologyState.aliases.clear();
  ontologyState.classInfoByName.forEach((info, name) => {
    ontologyState.aliases.set(name.toLowerCase(), name);
    if (info.label) ontologyState.aliases.set(info.label.toLowerCase(), name);
  });
}

async function loadOntologyData() {
  for (const url of ONTOLOGY_URL_CANDIDATES) {
    try {
      const response = await fetch(url);
      if (!response.ok) continue;
      const text = await response.text();
      parseOntologyTurtle(text);
      ontologyState.loaded = true;
      ontologyState.sourceUrl = url;
      console.log(`[KG Viewer] ✅ Ontology loaded from ${url} (${ontologyState.classInfoByName.size} classes)`);
      return;
    } catch (err) {
      console.warn(`[KG Viewer] Ontology fetch failed for ${url}:`, err);
    }
  }
  console.warn('[KG Viewer] Ontology not loaded. Falling back to built-in mapping.');
}

function resolveOntologyClass(name) {
  if (!name) return null;
  return ontologyState.aliases.get(String(name).trim().toLowerCase()) || null;
}

function getOntologyAncestors(className) {
  if (!className) return [];
  const visited = new Set();
  const queue = [className];
  const ancestors = [];
  while (queue.length > 0) {
    const current = queue.shift();
    const parents = ontologyState.parentsByName.get(current);
    if (!parents) continue;
    parents.forEach(parent => {
      if (visited.has(parent)) return;
      visited.add(parent);
      ancestors.push(parent);
      queue.push(parent);
    });
  }
  return ancestors;
}

function getOntologySemanticType(label) {
  const className = resolveOntologyClass(label);
  if (!className) return null;

  if (PROCESS_NODES.has(className)) return className;

  const preferred = ['Actor', 'Data', 'Symbol', 'Model', 'DesignPattern', 'Boxology'];
  if (preferred.includes(className)) return className;

  const ancestors = getOntologyAncestors(className);
  for (const root of preferred) {
    if (ancestors.includes(root)) return root;
  }

  if (ancestors.includes('Process') || className === 'Process') return 'Process';
  return className;
}

const legend = document.getElementById('legend');
const legendToggleBtn = document.getElementById('legend-toggle-btn');
const legendCloseBtn = document.getElementById('legend-close-btn');

function setLegendExpanded(expanded) {
  if (!legend || !legendToggleBtn) return;
  legend.classList.toggle('expanded', expanded);
  legendToggleBtn.textContent = expanded ? 'Hide Color Guide' : 'Color Guide';
}

if (legendToggleBtn) {
  legendToggleBtn.addEventListener('click', () => {
    setLegendExpanded(!(legend && legend.classList.contains('expanded')));
  });
}

if (legendCloseBtn) {
  legendCloseBtn.addEventListener('click', () => setLegendExpanded(false));
}

function getRootType(label, tree = shapeTypesTree, root = null) {
  const ontologyType = getOntologySemanticType(label);
  if (ontologyType) return ontologyType;

  for (const key in tree) {
    if (key.toLowerCase() === label.toLowerCase()) return root || key;
    const subtree = tree[key];
    if (subtree && typeof subtree === "object") {
      const found = getRootType(label, subtree, root || key);
      if (found) return found;
    }
  }
  return null;
}

function addTypedNode(obj) {
  const label = obj.name || obj.label || "";
  const rootType = getRootType(label) || "Data";
  return {
    id: obj.id,
    name: rootType,
    label: obj.label,
    type: label,
    rootType: rootType,
    semanticName: rootType,
    meta: obj
  };
}

function normalizePatternNode(obj) {
  const label = obj?.label || obj?.name || obj?.type || "";
  const rootType = getRootType(label) || getRootType(obj?.name || "") || "Data";
  return {
    ...obj,
    name: rootType,
    semanticName: rootType,
    label: obj?.label || obj?.name || label,
    type: obj?.type || label,
    rootType,
  };
}

// Process nodes definition (from GoJSBoxologyValidation)
const PROCESS_NODES = new Set(['Train', 'Engineer', 'Transform', 'Deduce']);
const OUTPUT_TARGETS = new Set(['Symbol', 'Model', 'Data']);

function validateDesignPattern(dp) {
  if (!dp.input || !dp.process || !dp.output) {
    console.warn('[KG Validation] Missing input, process, or output');
    return false;
  }
  
  // Use NAME field (not label) - follows the type hierarchy
  const inputNames = dp.input.map(i => i.name || i.semanticName || i.rootType).filter(Boolean);
  const processName = dp.process.name || dp.process.semanticName || dp.process.rootType;
  const outputNames = dp.output.map(o => o.name || o.semanticName || o.rootType).filter(Boolean);
  
  if (inputNames.length === 0 || !processName || outputNames.length === 0) {
    console.warn('[KG Validation] Missing name fields in input/process/output');
    return false;
  }
  
  // Resolve root types for each input/output through the type hierarchy
  // e.g., LSTM -> NeuralNetwork -> NeuralModel -> Model
  const inputRootTypes = inputNames.map(name => getRootType(name) || name);
  const processRootType = getRootType(processName) || processName;
  const outputRootTypes = outputNames.map(name => getRootType(name) || name);
  
  console.log(`[KG Validation] Pattern: ${inputRootTypes.join("-")}>${processRootType}>${outputRootTypes.join("-")}`);
  console.log(`[KG Validation] Leaf types - Inputs: ${inputNames.join(", ")}, Process: ${processName}, Outputs: ${outputNames.join(", ")}`);
  
  // Check 1: Process node must be valid
  if (!PROCESS_NODES.has(processRootType)) {
    console.warn(`[KG Validation] Invalid process type: "${processRootType}". Must be Train, Engineer, Transform, or Deduce`);
    return false;
  }
  
  // Check 2: Process must have inputs
  if (inputRootTypes.length === 0) {
    console.warn(`[KG Validation] Process "${processName}" has no inputs`);
    return false;
  }
  
  // Check 3: Process must have exactly one unique output root type
  const uniqueOutputRootTypes = new Set(outputRootTypes);
  if (uniqueOutputRootTypes.size > 1) {
    console.warn(`[KG Validation] Process "${processName}" has multiple different output types: ${Array.from(uniqueOutputRootTypes).join(", ")}`);
    return false;
  }
  
  // Check 4: Output root types must be valid targets (Symbol, Model, or Data)
  outputRootTypes.forEach(ot => {
    if (!OUTPUT_TARGETS.has(ot)) {
      console.warn(`[KG Validation] Invalid output root type "${ot}" - must be Symbol, Model, or Data`);
      return false;
    }
  });
  
  // Check 5: Pattern matches one of the valid patterns (using root types)
  const patternMatched = validPatterns.some(pattern => {
    const required = [...pattern.edges];
    const edges = [];
    
    // Build edges using root types
    inputRootTypes.forEach(input => {
      edges.push([input, processRootType]);
    });
    outputRootTypes.forEach(output => {
      edges.push([processRootType, output]);
    });
    
    // Check if all required edges exist
    return required.every(requiredEdge => 
      edges.some(edge => 
        edge[0] === requiredEdge[0] && edge[1] === requiredEdge[1]
      )
    );
  });
  
  if (!patternMatched) {
    console.warn(`[KG Validation] No valid pattern found for: ${inputRootTypes.join("-")}>${processRootType}>${outputRootTypes.join("-")}`);
  } else {
    console.log(`[KG Validation] ✅ Pattern validated successfully`);
  }
  
  return patternMatched;
}

function buildDesignPatternSummary(dp) {
  const semanticInputs = dp.input ? dp.input.map(i => i.name || i.semanticName || i.rootType).filter(Boolean) : [];
  const semanticOutputs = dp.output ? dp.output.map(o => o.name || o.semanticName || o.rootType).filter(Boolean) : [];
  const semanticProcess = dp.process ? (dp.process.name || dp.process.semanticName || dp.process.rootType) : "Unknown";

  const inputs = dp.input ? dp.input.map(i => i.label || i.type || i.name).filter(Boolean) : [];
  const outputs = dp.output ? dp.output.map(o => o.label || o.type || o.name).filter(Boolean) : [];
  const process = dp.process ? (dp.process.label || dp.process.type || dp.process.name) : "Unknown";
  
  const pattern = `${semanticInputs.join("-")}>${semanticProcess}>${semanticOutputs.join("-")}`;
  const inputCount = inputs.length;
  const outputCount = outputs.length;
  
  // Validate against actual patterns
  const isValid = validateDesignPattern(dp);
  const validityText = isValid ? "valid" : "invalid";
  
  return { pattern, inputCount, outputCount, inputs, outputs, validityText, semanticInputs, semanticOutputs, semanticProcess, process };
}

function generateNodeContent(d) {
  // Handle DesignPattern nodes
  if (d.type === "DesignPattern" && d.meta) {
    const summary = buildDesignPatternSummary(d.meta);

    "Transformer": "⚡",

  };

function showCommentBox(d, mouseEvent, nodePart, diagram) {
  const commentBox = document.getElementById("comment-box");
  
  if (!d) {
    commentBox.style.display = "none";
    return;
  }

  commentBox.innerHTML = generateNodeContent(d);
  commentBox.style.display = "block";

  const boxRect = commentBox.getBoundingClientRect();
  const padding = 12;
  let left = padding;
  let top = padding;

  // Prefer anchoring to the clicked node so the tooltip stays near the graph element.
  if (nodePart && diagram && nodePart.actualBounds) {
    const center = nodePart.actualBounds.center;
    const viewPoint = diagram.transformDocToView(center);
    const diagramRect = diagram.div ? diagram.div.getBoundingClientRect() : null;
    if (diagramRect) {
      left = diagramRect.left + viewPoint.x + 16;
      top = diagramRect.top + viewPoint.y + 16;
    }
  } else if (mouseEvent) {
    const clientX = typeof mouseEvent.clientX === "number" ? mouseEvent.clientX : mouseEvent.pageX;
    const clientY = typeof mouseEvent.clientY === "number" ? mouseEvent.clientY : mouseEvent.pageY;
    left = clientX + 16;
    top = clientY + 16;
  }

  const maxLeft = window.innerWidth - boxRect.width - padding;
  const maxTop = window.innerHeight - boxRect.height - padding;
  commentBox.style.left = Math.max(padding, Math.min(left, maxLeft)) + "px";
  commentBox.style.top = Math.max(padding, Math.min(top, maxTop)) + "px";
  
}

function explainNodeOntology(d) {
  if (!d) return null;
  const ontologyClass = resolveOntologyClass(d.type) || resolveOntologyClass(d.label);
  const ontologyInfo = ontologyClass ? ontologyState.classInfoByName.get(ontologyClass) : null;
  const fallbackInfo = ontologyMap[d.type] || ontologyMap[d.label] || null;
  const info = ontologyInfo || fallbackInfo;
  const ancestors = ontologyClass ? getOntologyAncestors(ontologyClass).slice(0, 6) : [];

  // Try to find the node's role in a pattern (input, output, process)
  let role = null, patternLabel = null;
  if (d.meta && d.meta._patternRole && d.meta._patternLabel) {
    role = d.meta._patternRole;
    patternLabel = d.meta._patternLabel;
  } else if (d.meta && d.meta.patternRole && d.meta.patternLabel) {
    // fallback for other naming
    role = d.meta.patternRole;
    patternLabel = d.meta.patternLabel;
  }

  let roleText = "";
  if (role && patternLabel) {
    roleText = `<p><b>Role in Pattern:</b> <span style='color:#0ea5e9;'>${role}</span> in <b>${patternLabel}</b></p>`;
  }

  if (info) {
    const lineageText = ancestors.length > 0
      ? `<p><b>Ontology Lineage:</b> ${[ontologyClass, ...ancestors].join(' -> ')}</p>`
      : '';
    const sourceText = ontologyInfo && ontologyState.sourceUrl
      ? `<p class="muted">Source ontology: ${ontologyState.sourceUrl}</p>`
      : '';
    return `<h3>🧠 Ontology Explanation</h3>
      <p><b>${info.label || d.label}</b></p>
      ${roleText}
      ${lineageText}
      <p style="color:#2563eb;">${info.comment || 'No ontology comment available for this class.'}</p>
      ${sourceText}`;
  }
  // Fallback: show type and label
  return `<h3>🧠 Ontology Explanation</h3>
    <p><b>${d.label}</b></p>
    ${roleText}
    <p class="muted">No ontology description available for this node type.</p>`;
}

function getTextColor(hex) {

  const g = parseInt(hex.slice(3, 5), 16);

function applyLayout(layoutType) {
  if (!myDiagram) return;
  if (layoutType === 'layered') {
    myDiagram.layout = new go.LayeredDigraphLayout({ direction: 0, layerSpacing: 70, columnSpacing: 30 });
  } else if (layoutType === 'circular') {
    myDiagram.layout = new go.CircularLayout({ spacing: 30 });
  } else if (layoutType === 'grid') {
    myDiagram.layout = new go.GridLayout({ spacing: new go.Size(40, 40) });
  } else {
    myDiagram.layout = new go.ForceDirectedLayout({ defaultElectricalCharge: 300, defaultSpringLength: 150 });
  }
  myDiagram.layoutDiagram(true);
}

function applyTypeFilter(filterType) {
  if (!myDiagram) return;
  activeTypeFilter = filterType || 'All';

  myDiagram.startTransaction('type-filter');
  myDiagram.nodes.each(node => {
    const nodeType = node.data.rootType || node.data.type;
    const keepContext = node.data.type === 'Boxology' || node.data.type === 'DesignPattern';
    node.visible = activeTypeFilter === 'All' || nodeType === activeTypeFilter || keepContext;
  });
  myDiagram.links.each(link => {
    link.visible = link.fromNode && link.toNode && link.fromNode.visible && link.toNode.visible;
  });
  myDiagram.commitTransaction('type-filter');
}

function setLabelMode(mode) {
  if (!myDiagram) return;
  const visible = mode !== 'none';
  myDiagram.startTransaction('label-mode');
  myDiagram.nodes.each(node => {
    const label = node.findObject('NODE_LABEL');
    if (label) label.visible = visible;
  });
  myDiagram.commitTransaction('label-mode');
}

function applySearchHighlight(text) {
  if (!myDiagram) return;

  myDiagram.startTransaction('search-highlight');
  if (!term) {
    myDiagram.nodes.each(node => {
      node.opacity = 1;
      node.scale = 1;
    });
    myDiagram.links.each(link => {
      link.opacity = 1;
    });
    myDiagram.commitTransaction('search-highlight');
    return;
  }

  const matched = new Set();
  myDiagram.nodes.each(node => {
    const name = `${node.data.label || ''} ${node.data.type || ''} ${node.data.rootType || ''}`.toLowerCase();
    const isMatch = name.includes(term);
    node.opacity = isMatch ? 1 : 0.15;
    node.scale = isMatch ? 1.15 : 1;
    if (isMatch) matched.add(node);
  });

  myDiagram.links.each(link => {
    const strong = matched.has(link.fromNode) || matched.has(link.toNode);
    link.opacity = strong ? 1 : 0.08;
  });
  myDiagram.commitTransaction('search-highlight');

  const firstMatch = Array.from(matched)[0];
  if (firstMatch) myDiagram.centerRect(firstMatch.actualBounds);
}

function normText(v) {
  return (v || '').toString().trim().toLowerCase();
}

function processPhrase(name) {
  const key = normText(name);
  if (key === 'train' || key === 'training') return 'trains a model';
  if (key === 'transform') return 'transforms artifacts';
  if (key === 'embed' || key === 'embedding') return 'embeds data representations';
  if (key === 'deduce' || key === 'infer' || key === 'induce' || key === 'induction') return 'infers symbolic outputs';
  if (key === 'engineer' || key === 'engineering') return 'engineers system artifacts';
  return `executes ${name || 'a process'}`;
}

function orderDesignPatterns(patterns) {
  const producedBy = new Map();
  patterns.forEach((p) => {
    (p.output || []).forEach((o) => {
      if (o && o.id) producedBy.set(o.id, p.id);
    });
  });

  const edges = new Map();
  const indegree = new Map();
  patterns.forEach((p) => {
    edges.set(p.id, new Set());
    indegree.set(p.id, 0);
  });

  patterns.forEach((target) => {
    (target.input || []).forEach((i) => {
      const src = i && i.id ? producedBy.get(i.id) : null;
      if (!src || src === target.id) return;
      if (!edges.get(src).has(target.id)) {
        edges.get(src).add(target.id);
        indegree.set(target.id, (indegree.get(target.id) || 0) + 1);
      }
    });
  });

  const queue = [];
  patterns.forEach((p) => {
    if ((indegree.get(p.id) || 0) === 0) queue.push(p.id);
  });

  const byId = new Map(patterns.map((p) => [p.id, p]));
  const ordered = [];
  while (queue.length > 0) {
    const id = queue.shift();
    const p = byId.get(id);
    if (!p) continue;
    ordered.push(p);
    (edges.get(id) || []).forEach((next) => {
      const d = (indegree.get(next) || 0) - 1;
      indegree.set(next, d);
      if (d === 0) queue.push(next);
    });
  }

  if (ordered.length < patterns.length) {
    const seen = new Set(ordered.map((p) => p.id));
    patterns.forEach((p) => {
      if (!seen.has(p.id)) ordered.push(p);
    });
  }
  return ordered;
}

function generateSystemDocumentation(raw) {
  const box = raw && raw.boxologies && raw.boxologies[0];
  if (!box) throw new Error('No boxology found in KG data.');

  const patterns = orderDesignPatterns(box.DesignPattern || []);

  const allInputs = [];
  const allOutputs = [];
  patterns.forEach((p) => {
    (p.input || []).forEach((i) => allInputs.push(i));
    (p.output || []).forEach((o) => allOutputs.push(o));
  });

  const uniqById = (arr) => {
    const seen = new Set();
    return arr.filter((x) => {
      if (!x || !x.id || seen.has(x.id)) return false;
      seen.add(x.id);
      return true;
    });
  };

  const inputNames = uniqById(allInputs).slice(0, 5).map((x) => x.label || x.name || x.id);
  const outputNames = uniqById(allOutputs).slice(0, 5).map((x) => x.label || x.name || x.id);

  const flow = patterns.map((p) => {
    const proc = p.process || {};
    const procName = proc.label || proc.name || 'Process';
    return `${p.label}: ${processPhrase(proc.name || proc.label || '')}`;
  });

  const pipelineLine = patterns.map((p) => (p.process?.label || p.process?.name || p.label)).join(' -> ');

  const lines = [];
  lines.push('# Automatic System Documentation');
  lines.push('');
  lines.push(`## ${box.label || box.id}`);
  lines.push('');
  lines.push('### System Description');
  lines.push('');
  lines.push(`The system collects ${inputNames.length ? inputNames.join(', ') : 'input artifacts'}, performs an ordered pipeline of transformations and inference steps (${flow.join('; ')}), and produces ${outputNames.length ? outputNames.join(', ') : 'output artifacts'}.`);
  lines.push('');
  lines.push('### Example Pipeline');
  lines.push('');
  lines.push(pipelineLine || 'No process pipeline detected.');
  lines.push('');
  lines.push('### Design Patterns');
  lines.push('');

  patterns.forEach((p, idx) => {
    const proc = p.process || {};
    const inTxt = (p.input || []).map((x) => x.label || x.name || x.id).join(', ') || 'none';
    const outTxt = (p.output || []).map((x) => x.label || x.name || x.id).join(', ') || 'none';
    lines.push(`${idx + 1}. ${p.label}`);
    lines.push(`   - Process: ${proc.label || proc.name || 'Unknown'}`);
    lines.push(`   - Inputs: ${inTxt}`);
    lines.push(`   - Outputs: ${outTxt}`);
  });

  return lines.join('\n');
}

function downloadTextFile(content, filename, mimeType) {

}

const T4B_CONFIG = {
  SPARQL_ENDPOINT: `${BACKEND_URL}/api/t4b/sparql`,
};

function buildT4BBoxologyLookupQuery(boxologyUri) {
  const safeUri = String(boxologyUri || '').trim();
  return `
PREFIX t4b: <http://tool4boxology.org/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?label
WHERE {
  <${safeUri}> a t4b:Boxology ;
            rdfs:label ?label .
}
  `.trim();
}

async function queryT4BBoxology(boxologyUri) {
  const response = await fetch(T4B_CONFIG.SPARQL_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
      'Accept': 'application/sparql-results+json',
    },
    body: new URLSearchParams({ query: buildT4BBoxologyLookupQuery(boxologyUri) }).toString(),
  });

  if (!response.ok) {
    const errorText = await response.text().catch(() => '');
    throw new Error(`Tool4Boxology query failed: ${response.status} ${response.statusText}${errorText ? ` - ${errorText}` : ''}`);
  }

  return response.json();
}

function formatT4BBoxologyResults(results, boxologyUri) {
  const bindings = results?.results?.bindings || [];
  if (bindings.length === 0) {
    return `
      <div class="result-item" style="border-left-color:#ef4444;">
        <p style="margin:0;">No corresponding Boxology label found for <b>${escapeHtml(boxologyUri)}</b>.</p>
      </div>
    `;
  }

  return `
    <p style="margin:0;color:#475569;">Tool4Boxology label${bindings.length === 1 ? '' : 's'} for <b>${escapeHtml(boxologyUri)}</b>:</p>
    <div class="result-list">
      ${bindings.map((binding) => {
        const label = binding.label?.value || 'Unnamed Boxology';
        return `
          <div class="result-item">
            <p style="margin:0;color:#0f172a;font-weight:700;">${escapeHtml(label)}</p>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ============================================================
// GoJS-based KG renderer (concept map approach)
// ============================================================
function renderKG(raw) {
  currentBoxology = raw;

  const nodesMap = {};
  const linksArr = [];
  const box = raw?.boxologies?.[0];

  if (!box) {
    document.getElementById('panel').innerHTML =
      '<h3>⚠️ Invalid KG JSON</h3><p class="error">Missing "boxologies[0]" in the JSON.</p>';
    return;
  }

  function ensureNode(obj) {
    if (nodesMap[obj.id]) return;
    const color = getNodeColor(obj.rootType);
    nodesMap[obj.id] = {
      key: obj.id,
      id: obj.id,             // kept for backward-compat with utility fns
      label: obj.label,
      type: obj.type,
      rootType: obj.rootType,
      color: color,
      textColor: getTextColor(color),
      meta: obj.meta,
    };
  }

  ensureNode({ id: box.id, label: box.label, type: 'Boxology', rootType: 'Boxology', meta: box });

  for (const dp of box.DesignPattern || []) {
    const normalizedDp = {
      ...dp,
      input: (dp.input || []).map(normalizePatternNode),
      process: dp.process ? normalizePatternNode(dp.process) : null,
      output: (dp.output || []).map(normalizePatternNode),
    };

    ensureNode({ id: dp.id, label: dp.label, type: 'DesignPattern', rootType: 'DesignPattern', meta: normalizedDp });
    linksArr.push({ from: box.id, to: dp.id, text: 'hasPattern' });

    if (normalizedDp.input)   for (const inp of normalizedDp.input)  { const t = addTypedNode(inp);      ensureNode(t); linksArr.push({ from: dp.id, to: t.id, text: 'hasInput' }); }
    if (normalizedDp.process) { const t = addTypedNode(normalizedDp.process); ensureNode(t); linksArr.push({ from: dp.id, to: t.id, text: 'hasProcess' }); }
    if (normalizedDp.output)  for (const out of normalizedDp.output) { const t = addTypedNode(out);      ensureNode(t); linksArr.push({ from: dp.id, to: t.id, text: 'hasOutput' }); }
  }

  const nodeDataArray = Object.values(nodesMap);
  currentNodeDataArray = nodeDataArray;
  currentLinksArray = linksArr;
  updateGraphStats();
  populateTypeFilter();
  setupExplorerControls();

  // Detach any previous diagram
  if (myDiagram) myDiagram.div = null;

  // Build GoJS diagram
  myDiagram = new go.Diagram('myDiagramDiv', {
    initialAutoScale: go.AutoScale.Uniform,
    contentAlignment: go.Spot.Center,
    layout: new go.ForceDirectedLayout({
      defaultElectricalCharge: 300,
      defaultSpringLength: 150,
    }),
  });

  // ── Node template: rounded rectangles with data-driven colours ──────────
  myDiagram.nodeTemplate =
    new go.Node('Auto', { locationSpot: go.Spot.Center, cursor: 'pointer' })
      .add(
        new go.Shape('RoundedRectangle', { strokeWidth: 2, stroke: 'rgba(255,255,255,0.4)' })
          .bind('fill', 'color'),
        new go.TextBlock({
          name: 'NODE_LABEL',
          font: 'bold 10pt Segoe UI, sans-serif',
          margin: new go.Margin(6, 10, 6, 10),
          maxSize: new go.Size(160, NaN),
          wrap: go.Wrap.Fit,
          overflow: go.TextOverflow.Ellipsis,
        })
          .bind('stroke', 'textColor')
          .bind('text', 'label')
      );

  // ── Link template: concept-map style with labelled links ─────────────────
  myDiagram.linkTemplate =
    new go.Link({ curve: go.Curve.Bezier, adjusting: go.LinkAdjusting.Stretch })
      .add(
        new go.Shape({ stroke: '#a3a3a3', strokeWidth: 1.7 }),
        new go.Shape({ toArrow: 'standard', stroke: null, fill: '#a3a3a3' }),
        new go.Panel('Auto')
          .add(
            new go.Shape({
              fill: new go.Brush('Radial', {
                0: 'rgb(243,244,246)',
                0.3: 'rgb(243,244,246)',
                1: 'rgba(243,244,246,0)',
              }),
              stroke: null,
            }),
            new go.TextBlock({
              textAlign: 'center',
              font: '9pt Segoe UI, sans-serif',
              stroke: '#64748b',
              margin: 3,
            }).bind('text')
          )
      );

  // ── Click: node details ──────────────────────────────────────────────────
  myDiagram.addDiagramListener('ObjectSingleClicked', function (e) {
    const part = e.subject.part;
    if (!(part instanceof go.Node)) return;

    const d = part.data;

    // Annotate with pattern role (input / output / process)
    if (!d.meta._patternRole && d.meta && currentBoxology && currentBoxology.boxologies) {
      for (const b of currentBoxology.boxologies) {
        for (const dp of b.DesignPattern || []) {
          if (dp.input  && dp.input.some(i => i.id === d.key))  { d.meta._patternRole = 'input';   d.meta._patternLabel = dp.label; }
          if (dp.output && dp.output.some(o => o.id === d.key)) { d.meta._patternRole = 'output';  d.meta._patternLabel = dp.label; }
          if (dp.process && dp.process.id === d.key)            { d.meta._patternRole = 'process'; d.meta._patternLabel = dp.label; }
        }
      }
    }

    // Position and show the hover comment box
    const mouseEvt = e.diagram.lastInput.event;
    showCommentBox(d, mouseEvt, part, e.diagram);

    // Ontology explanation in the side panel
    document.getElementById('panel').innerHTML = explainNodeOntology(d);

  });

  // ── Background click: hide comment box ───────────────────────────────────
  myDiagram.addDiagramListener('BackgroundSingleClicked', function () {
    document.getElementById('comment-box').style.display = 'none';
  });

  myDiagram.model = new go.GraphLinksModel(nodeDataArray, linksArr);
  applyTypeFilter(activeTypeFilter);
}

// Load KG from blob URL query param
void (async function initKGViewer() {
  await loadOntologyData();
  setupExplorerControls();
  setupDocumentationButton();
  const params = new URLSearchParams(window.location.search);
  const blobUrl = params.get('blob');
  if (blobUrl) {
    fetch(blobUrl).then(r => r.json()).then(renderKG);
  } else {
    document.getElementById('panel').innerHTML =
      '<h3>Welcome</h3><p>No KG loaded. Use "Upload KG JSON" or open from the main app.</p>';
  }
})();
</script>
