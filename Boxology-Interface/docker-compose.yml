services:
  # Backend (development) - runs the uvicorn command you use locally
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: boxology-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - t4b_local_models:/data/t4b-local-llm
    working_dir: /app
    # --reload removed: its file-watcher (inotify, and polling fares no better) was
    # crashing with "Cannot allocate memory" under this project's WSL2 memory ceiling
    # (~7.4GB), especially once a long-running local-model request was in flight.
    # After editing backend code, run `docker compose restart backend` to pick it up.
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - boxology-network
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - SPARQL_QUERY_ENDPOINT=http://boxology_kg:8890/sparql
      - SPARQL_UPDATE_ENDPOINT=http://boxology_kg:8890/sparql-auth
      - T4B_LOCAL_CACHE_DIR=/data/t4b-local-llm
      - T4B_LOCAL_N_CTX=${T4B_LOCAL_N_CTX:-16384}
      - T4B_GENERATION_WORKFLOW=${T4B_GENERATION_WORKFLOW:-agents}
      - T4B_BUILDER_PROVIDER=${T4B_BUILDER_PROVIDER:-gemini}
      - T4B_BUILDER_MODEL=${T4B_BUILDER_MODEL:-gemini-3.5-flash-lite}
      - T4B_BUILDER_API_KEY=${T4B_BUILDER_API_KEY:-}
      - T4B_BUILDER_TIMEOUT_SECONDS=${T4B_BUILDER_TIMEOUT_SECONDS:-180}
      - T4B_LOCAL_BUILDER_PATH=${T4B_LOCAL_BUILDER_PATH:-}
      - T4B_LOCAL_ADAPTERS_DIR=${T4B_LOCAL_ADAPTERS_DIR:-/app/backend/local_t4b/adapters}
      - T4B_PLAN_MAX_TOKENS=${T4B_PLAN_MAX_TOKENS:-6144}
      - T4B_PLAN_ATTEMPTS=${T4B_PLAN_ATTEMPTS:-3}
      - MODAL_REQUEST_TIMEOUT_SECONDS=${MODAL_REQUEST_TIMEOUT_SECONDS:-300}
      - MODAL_T4B_CHAT_URL=${MODAL_T4B_CHAT_URL:-https://mahsa-f91--t4b-llama-adapters-t4bllama-chat.us-east.modal.run}
      - MODAL_T4B_HEALTH_URL=${MODAL_T4B_HEALTH_URL:-https://mahsa-f91--t4b-llama-adapters-t4bllama-health.us-east.modal.run}
      # Read from .env (gitignored, see .env.example) - the shared Modal GPU
      # endpoint's bearer token. Only the site operator holds this.
      - MODAL_T4B_API_KEY=${MODAL_T4B_API_KEY:-}
      # Optional overrides for local dev (see .env.example) - unset falls back
      # to main.py's public-deployment-safe defaults (5/hour, 50/day).
      - MODAL_RATE_LIMIT_PER_IP_PER_HOUR=${MODAL_RATE_LIMIT_PER_IP_PER_HOUR:-}
      - MODAL_RATE_LIMIT_GLOBAL_PER_DAY=${MODAL_RATE_LIMIT_GLOBAL_PER_DAY:-}

    depends_on:
      - boxology_kg



  # Development build (frontend) — depends on backend
  boxology-interface-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: boxology-interface-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - boxology-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
  
  boxology_kg:
    container_name: boxology_kg
    image: kemele/virtuoso:7-stable
    restart: unless-stopped
    ports:
      - "8890:8890"
    volumes:
      - kg_data:/data
    networks:
      - boxology-network


networks:
  boxology-network:
    driver: bridge

volumes:
  kg_data:
  t4b_local_models:
