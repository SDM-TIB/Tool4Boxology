services:
  # Backend (development) - runs the uvicorn command you use locally
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: boxology-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend --reload-dir src
    restart: unless-stopped
    networks:
      - boxology-network
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - SPARQL_QUERY_ENDPOINT=http://boxology_kg:8890/sparql
      - SPARQL_UPDATE_ENDPOINT=http://boxology_kg:8890/sparql-auth
    
    depends_on:
      - boxology_kg



  # Development build (frontend) — depends on backend
  boxology-interface-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: boxology-interface-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - boxology-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
  
  boxology_kg:
    container_name: boxology_kg
    image: kemele/virtuoso:7-stable
    restart: unless-stopped
    ports:
      - "8890:8890"
    volumes:
      - kg_data:/data
    networks:
      - boxology-network

  detrusty:
    image: sdmtib/detrusty:latest
    container_name: detrusty
    volumes:
      - ./FedTool4Boxology/source_descriptors:/DeTrusty/Config/
      - ./logs:/var/log/detrusty
    ports:
      - "5000:5000"
    environment:
      - JOIN_STARS_LOCALLY=False
      - FEDERATION_ADMIN_KEY=changemeplease
    networks:
      - boxology-network

  ft4b_rdfizer:
    container_name: ft4b_rdfizer
    image: sdmtib/sdmrdfizer:latest
    volumes:
      - ./FedTool4Boxology:/data
    networks:
      - boxology-network
    environment:
      - SPARQL_ENDPOINT_IP=ft4bkg
      - SPARQL_ENDPOINT_USER=dba
      - SPARQL_ENDPOINT_PASSWD=dba
      - SPARQL_ENDPOINT_PORT=1111
      - SPARQL_ENDPOINT_GRAPH=http://ft4bkg:8890/sparql/
      - RDF_DUMP_FOLDER_PATH=/data/rdf-dump/
      - SPARQL_MAPPINGS_ENDPOINT_IP=ft4b_mappings

  ft4bkg:
    image: kemele/virtuoso:7-stable
    hostname: ft4bkg
    container_name: ft4bkg
    domainname: ft4b
    volumes:
      - ./FedTool4Boxology/virtuoso-travshacl:/data
      - ./FedTool4Boxology:/data/rdf-dump
    ports:
      - "18001:8890"
    networks:
      - boxology-network
  
  ft4b_travshacl_data:
    container_name: ft4b_travshacl_data
    image: prohde/virtuoso-opensource-7:7.2.14-alpine
    volumes:
      - ./FedTool4Boxology/ntfiles:/database/toLoad
      - ./FedTool4Boxology/virtuoso-travshacl:/database
    mem_limit: 4g
    ports:
      - '9092:8890'
    networks:
      - boxology-network

  ft4b_travshacl_engine:
    container_name: ft4b_travshacl_engine
    image: sdmtib/travshacl:latest
    volumes:
      - ./FedTool4Boxology/shapes:/shapes
    mem_limit: 4g
    ports:
      - '9091:5000'
    networks:
      - boxology-network
    depends_on:
      - ft4b_travshacl_data

networks:
  boxology-network:
    driver: bridge

volumes:
  kg_data:
